services:
  - type: web
    name: novix-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: AI_PROVIDER
        value: nvidia
      - key: AI_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_API_KEY
        sync: false
